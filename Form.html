<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form - Gerardo R. Sonido Jr.</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/Form.css">
    
</head>
<video autoplay loop id="bg-video">
    <source src="audioandimages/bidyo.mp4" type="video/mp4">
</video>

<body id="top">

    <!-- Navigation Bar -->
    <header class="navbar">
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="Lesson.html">Lesson</a></li>
                <li><a href="Resume.html">Resume</a></li>
                <li><a href="Gallery.html">Gallery</a></li>
                <li><a href="Contacts.html">Contacts</a></li>
                <li><a href="Schedule.html">Schedule</a></li>
                <li><a href="Form.html">Form</a></li>
                <li><a href="Multimedia.html">Multimedia</a></li>
                <li><a href="Flip Card.html">Card</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Form Section -->
    <main class="form-page">


        <div class="form-card">

            <!-- Login and Register Tabs -->
            <div class="tabs">
                <button
                    type="button"
                    class="tab tab-active"
                    id="tab-login"
                    aria-selected="true"
                    aria-controls="login-page">
                    Login
                </button>

                <button
                    type="button"
                    class="tab"
                    id="tab-register"
                    aria-selected="false"
                    aria-controls="registration-page">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <div id="login-page">

                <form id="login-form">
                    <h2 class="form-title">Login</h2>

                    <div class="form-row">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            maxlength="20"
                            class="form-input"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="form-row">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            maxlength="10"
                            class="form-input"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button type="submit" class="form-button">
                        Submit
                    </button>
                </form>

            </div>

            
            <div id="registration-page" hidden>

                <form id="registration-form">
                    <h2 class="form-title">Registration</h2>

                    <div class="form-row">
                        <label for="fullname" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            class="form-input"
                            autocomplete="name"
                            required>
                    </div>

                   
                    <div class="choice-group">
                        <p class="choice-title">Gender</p>

                        <div class="choice-list">
                            <label class="choice-item">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                    required>
                                <span>Male</span>
                            </label>

                            <label class="choice-item">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female">
                                <span>Female</span>
                            </label>
                        </div>
                    </div>

                   
                    <div class="choice-group">
                        <p class="choice-title">Music</p>

                        <div class="choice-list">
                            <label class="choice-item">
                                <input
                                    type="checkbox"
                                    name="music"
                                    value="Kpop">
                                <span>Kpop</span>
                            </label>

                            <label class="choice-item">
                                <input
                                    type="checkbox"
                                    name="music"
                                    value="Rock">
                                <span>Rock</span>
                            </label>

                            <label class="choice-item">
                                <input
                                    type="checkbox"
                                    name="music"
                                    value="Ballad">
                                <span>Ballad</span>
                            </label>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-row">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            autocomplete="email"
                            required>
                    </div>

                    <!-- Country -->
                    <div class="form-row">
                        <label for="country" class="form-label">
                            Country
                        </label>

                        <select
                            id="country"
                            name="country"
                            class="form-input"
                            required>
                            <option value="Philippines">Philippines</option>
                            <option value="India">India</option>
                            <option value="Israel">Israel</option>
                        </select>
                    </div>

                    <!-- Birthdate -->
                    <div class="form-row">
                        <label for="birthdate" class="form-label">
                            Birthdate
                        </label>

                        <input
                            type="date"
                            id="birthdate"
                            name="birthdate"
                            class="form-input"
                            required>
                    </div>

                    <button type="submit" class="form-button">
                        Submit
                    </button>
                </form>

            </div>

        </div>
    </main>

   
    <script>
        const loginTab = document.getElementById("tab-login");
        const registerTab = document.getElementById("tab-register");

        const loginPage = document.getElementById("login-page");
        const registrationPage = document.getElementById("registration-page");

        // Switch to Login
        loginTab.addEventListener("click", function () {
            loginPage.hidden = false;
            registrationPage.hidden = true;

            loginTab.classList.add("tab-active");
            registerTab.classList.remove("tab-active");

            loginTab.setAttribute("aria-selected", "true");
            registerTab.setAttribute("aria-selected", "false");
        });

        
        registerTab.addEventListener("click", function () {
            loginPage.hidden = true;
            registrationPage.hidden = false;

            registerTab.classList.add("tab-active");
            loginTab.classList.remove("tab-active");

            registerTab.setAttribute("aria-selected", "true");
            loginTab.setAttribute("aria-selected", "false");
        });

       
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            // Demo credentials
            if (username === "Ebong" && password === "123") {
                alert("Login successful! Welcome, " + username + "!");

               
                window.location.href = "Home.html";
            } else {
                alert("Invalid username or password. Please try again.");
            }
        });

        // Handle Registration
        document.getElementById("registration-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const country = document.getElementById("country").value;
            const email = document.getElementById("email").value.trim();
            const birthdate = document.getElementById("birthdate").value;

            const selectedGender = document.querySelector(
                'input[name="gender"]:checked'
            );

            const selectedMusic = Array.from(
                document.querySelectorAll('input[name="music"]:checked')
            ).map(function (music) {
                return music.value;
            });

            const gender = selectedGender
                ? selectedGender.value
                : "Not selected";

            const music = selectedMusic.length > 0
                ? selectedMusic.join(", ")
                : "None selected";

            alert(
                "Registration Successful!\n\n" +
                "Full Name: " + fullname + "\n" +
                "Gender: " + gender + "\n" +
                "Music: " + music + "\n" +
                "Email: " + email + "\n" +
                "Country: " + country + "\n" +
                "Birthdate: " + birthdate
            );

            // Prevents the page from reloading.
            // This demo does not save the registration.
        });
    </script>

    <!-- Footer -->
    <footer>
        <a href="#top">Return to Top</a>
        <p>&copy; 2026 | Gerardo R. Sonido Jr.</p>
    </footer>

</body>
</html>
